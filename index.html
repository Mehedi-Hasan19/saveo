<style>

.logo.img{width:76px;height:76px;background:none;border-radius:20px;box-shadow:0 12px 34px var(--sh);overflow:hidden}.logo.img img{width:100%;height:100%;display:block}

<section class="view" id="auth">
 <div class="acard glass" id="aCard">
  <div class="logo img"><img data-ico alt="SAVEO"></div>
  <div class="seg" id="aSeg"><button type="button" data-m="login" class="on">Login</button><button type="button" data-m="signup">Sign Up</button></div>
  <div class="abody" id="aBody"><div class="ain" id="aIn"></div></div>

 </div>
</section>
<div class="view" id="app">
<header>
  <div class="hrow"><div><h1><img class="bi" data-ico alt="">SAVEO</h1><small id="sub"></small></div>
  <div class="hbtns"><button class="av" id="avBtn" data-open="pf" aria-label="Profile">?</button><button class="pillb glass" id="logoutBtn" data-logout>Logout</button></div></div>
  <div id="banner" class="glass"><span>🔔</span><p id="bannerTx"></p><button class="del" id="bannerX" aria-label="Dismiss">✕</button></div>
</header>

<main>
  <section class="tab on" id="t-dash"></section>
  <section class="tab" id="t-hist"></section>
  <section class="tab" id="t-set"></section>
</main>

<button class="fab" id="fab" aria-label="Add transaction">+</button>
<nav class="glass"><i class="pill" id="pill"></i>
  <button data-tab="dash" class="on"><span>◉</span>Dashboard</button>
  <button data-tab="hist"><span>☰</span>History</button>
  <button data-tab="set"><span>⚙︎</span>Settings</button>
</nav>

<div class="wrap" id="wrap">
  <div class="sheet glass" id="sheet">
    <h3 id="mHead">New entry</h3>
    <div class="seg" id="mType"><button data-t="exp" class="on">Expense</button><button data-t="save">Savings / Income</button></div>
    <div class="big"><input class="amt" id="mAmt" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></div>
    <div class="mu">Category</div>
    <div class="chips" id="mCats"></div>
    <div class="add"><input type="text" id="mNew" placeholder="New category" maxlength="20"><button class="btn" id="mAddC">Add</button></div>
    <div class="fw"><input type="text" id="mNote" placeholder="Note (optional)" maxlength="60"><input type="date" id="mDate" style="width:150px"></div>
    <div class="btns" style="margin-top:16px"><button class="btn" id="mCancel">Cancel</button><button class="btn pri" id="mSave">Save entry</button></div>
  </div>
</div>
</div>
<div class="wrap" id="pfWrap"><div class="sheet glass">
  <div class="shh"><h3>Profile</h3><button class="btn" style="padding:8px 16px" data-close="pfWrap">Done</button></div>
  <div class="pfh"><div class="av lg" id="pfAv">?</div><div><h3 id="pfName"></h3><div class="mu" id="pfMail"></div></div></div>
  <label class="lb" for="pfN">Display name</label><input class="fi" id="pfN" type="text" maxlength="40" autocomplete="off"><div class="msg" id="pfNm"></div>
  <button class="btn pri" id="pfSaveN">Save name</button>
  <label class="lb" style="margin-top:20px">Change password</label>
  <div class="pw"><input class="fi" id="pfCur" type="password" autocomplete="current-password" placeholder="Current password"><button type="button" class="eye" data-eye="pfCur"></button></div>
  <div class="pw"><input class="fi" id="pfNew" type="password" autocomplete="new-password" placeholder="New password (6+ characters)"><button type="button" class="eye" data-eye="pfNew"></button></div>
  <div class="pw"><input class="fi" id="pfNew2" type="password" autocomplete="new-password" placeholder="Confirm new password"><button type="button" class="eye" data-eye="pfNew2"></button></div>
  <div class="msg" id="pfPm"></div>
  <button class="btn pri" id="pfSaveP">Update password</button>
 </div></div>
<div class="wrap" id="cuWrap"><div class="sheet glass">

  <div class="lb">Theme</div><div class="seg" id="cuTh"><button data-th="dark">Dark</button><button data-th="light">Light</button></div>
  <div class="lb">Accent color</div><div class="accs" id="cuAcc"></div>

 </div></div>

const LEGACY='pocketLedger.v1',C=2*Math.PI*40;let KEY='',user=null;
const ACC={mono:null,blue:['#0a84ff','#fff'],green:['#30d158','#04210d'],violet:['#bf5af2','#fff'],amber:['#ffb020','#2a1a00'],rose:['#ff375f','#fff']};
const WIDS=['balance','rings','streak','month','quick','cats'];
const DEF={tx:[],cats:{save:['Salary','Pocket money','Gift','Other'],exp:['Food','Transport','Study','Shopping','Bills','Other']},
 set:{theme:'dark',cur:'৳',target:100,minEntry:50,limit:500,remind:true,interval:30,banner:true,sound:true,notif:true,dailyTime:'21:00',extra:3},
 ui:{accent:'mono',widgets:WIDS.map(id=>({id,on:true}))},
 quick:[{id:'q1',label:'Save ৳100',type:'save',amt:100,cat:'Pocket money'},{id:'q2',label:'Tea',type:'exp',amt:20,cat:'Food'},{id:'q3',label:'Bus fare',type:'exp',amt:30,cat:'Transport'}]};
const NUM=['target','minEntry','limit','interval'];
let S=merge(null),tab='dash',per='today',flt='all',qry='',editId=null,sort='new',catf='all',qedit=false,pm=false,gdraft={},histLim=60,qT,mt='exp',mc='',lastFire=Date.now(),bannerHidden=false,actx=null,toastT,schT,animT,anim=true,lastOff={},lastCol={},lastW={};
const TABS=['dash','hist','set'];

function read(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){if(!KEY)return;try{LS.set(KEY,JSON.stringify(S))}catch(e){toast('Storage is full or blocked',1)}}
function persist(){save();clearTimeout(schT);schT=setTimeout(()=>{schT=0;schedule()},700)}
function mergeUI(u){
  const out=[],seen=new Set();
  if(u&&Array.isArray(u.widgets))u.widgets.forEach(w=>{if(w&&WIDS.includes(w.id)&&!seen.has(w.id)){seen.add(w.id);out.push({id:w.id,on:w.on!==false})}});
  WIDS.forEach(id=>{if(!seen.has(id))out.push({id,on:true})});
  return{accent:u&&Object.keys(ACC).includes(u.accent)?u.accent:'mono',widgets:out};
}
function mergeQuick(q,d){
  return Array.isArray(q)?q.filter(x=>x&&x.label&&(x.type==='save'||x.type==='exp')&&x.amt>0).map(x=>({id:String(x.id||Math.random().toString(36).slice(2)),label:String(x.label).slice(0,24),type:x.type,amt:+x.amt,cat:String(x.cat||'Other')})):d;
}
function merge(r){
  const d=JSON.parse(JSON.stringify(DEF));if(!r||typeof r!=='object')return d;
  const ok=t=>t&&(t.type==='save'||t.type==='exp')&&isFinite(t.amt)&&t.amt>0&&/^\d{4}-\d\d-\d\d$/.test(t.date);
  const ar=(a,f)=>Array.isArray(a)&&a.length?[...new Set(a.map(x=>String(x).trim()).filter(Boolean))]:f;
  const s={...d.set,...(r.set||{})};
  NUM.forEach(k=>{s[k]=Number(s[k]);if(!isFinite(s[k])||s[k]<0)s[k]=d.set[k]});
  s.cur=String(s.cur||'৳').slice(0,4);if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(s.dailyTime))s.dailyTime='21:00';s.extra=[0,2,3,4].includes(Number(s.extra))?Number(s.extra):3;
  return{tx:(Array.isArray(r.tx)?r.tx:[]).filter(ok).map(t=>({id:String(t.id||Math.random().toString(36).slice(2)),type:t.type,amt:+t.amt,note:String(t.note||'').slice(0,60),date:t.date,cat:String(t.cat||'Other')})),
    cats:{save:ar(r.cats&&r.cats.save,d.cats.save),exp:ar(r.cats&&r.cats.exp,d.cats.exp)},set:s,ui:mergeUI(r.ui),quick:mergeQuick(r.quick,d.quick)};
}

/* ---------- helpers ---------- */
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const T=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'-':'')+S.set.cur+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2});
const sum=(type,f)=>S.tx.reduce((a,t)=>t.type===type&&(!f||f(t))?a+t.amt:a,0);
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
const col=n=>`hsl(${hue(n)} 75% 62%)`;
const day=s=>{const t=T();return s===t?'Today':s===addDays(t,-1)?'Yesterday':new Date(s+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})};

/* ---------- derived numbers ---------- */
const todaySave=()=>sum('save',t=>t.date===T());
const todayExp=()=>sum('exp',t=>t.date===T());
const need=()=>{const goal=S.set.minEntry>0?S.set.minEntry:S.set.target;return Math.max(0,goal-todaySave())};
function streak(){
  const m={};S.tx.forEach(t=>{if(t.type==='save')m[t.date]=(m[t.date]||0)+t.amt});
  const g=S.set.target;if(g<=0)return 0;
  let d=T(),n=0;if((m[d]||0)<g)d=addDays(d,-1);
  while((m[d]||0)>=g){n++;d=addDays(d,-1)}
  return n;
}
const saveColor=p=>p>=100?'var(--g1)':p>=50?'var(--tx)':'var(--g2)';
const expColor=p=>p>=100?'var(--g3)':p>=80?'var(--g2)':'var(--g1)';
function ring(id,p,color){const off=C*(1-Math.min(p,100)/100),from=!anim&&lastOff[id]!==undefined?lastOff[id]:C,fc=!anim&&lastCol[id]||color;lastOff[id]=off;lastCol[id]=color;return`<div class="rw"><svg class="ring" viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="40"/><circle class="bar" cx="50" cy="50" r="40" style="stroke:${fc};stroke-dasharray:${C};stroke-dashoffset:${from}" data-off="${off}" data-col="${color}"/></svg><div class="rc">${p>999?'999+':Math.round(p)}%</div></div>`}

/* ---------- render ---------- */
function render(){
  applyUI();if(user)$('#avBtn').textContent=ini(user.name);const t=T();$('#sub').textContent=(user?'Hi, '+user.name.split(' ')[0]+' · ':'')+new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  if(themeKey!==S.set.theme){themeKey=S.set.theme;document.documentElement.dataset.theme=themeKey;$('meta[name=theme-color]').content=themeKey==='dark'?'#000000':'#f2f2f4';if(user)try{LS.set('saveo.theme',themeKey)}catch(e){}}
  if(tab==='dash')dash();else if(tab==='hist')hist();else settings();
  $$('#app .seg[id]').forEach(g=>slideSeg(g));
  banner();
  const el=$('#t-'+tab);
  
  settle();
}
function settle(){requestAnimationFrame(()=>requestAnimationFrame(()=>{$$('.bar[data-off]').forEach(b=>{b.style.strokeDashoffset=b.dataset.off;b.style.stroke=b.dataset.col});$$('[data-w]').forEach(i=>i.style.transform=`scaleX(${i.dataset.w/100})`);anim=false}))}
function movePill(){const b=$('nav button.on'),p=$('#pill');if(!b)return;p.style.width=b.offsetWidth+'px';p.style.transform=`translateX(${b.offsetLeft}px)`}
function go(){
  const i=TABS.indexOf(tab);
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $$('.tab').forEach(t=>{const j=TABS.indexOf(t.id.slice(2));t.classList.toggle('on',j===i);t.classList.toggle('pre',j<i)});
  anim=true;render();$('#t-'+tab).scrollTop=0;movePill();
}
function catRows(){
  const month=t=>t.date.startsWith(T().slice(0,7)),cur=per==='today'?t=>t.date===T():month,by={};
  S.tx.forEach(t=>{if(t.type==='exp'&&cur(t))by[t.cat]=(by[t.cat]||0)+t.amt});
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),tot=rows.reduce((a,r)=>a+r[1],0);
  if(!rows.length)return'<div class="empty">No expenses logged yet. Tap + to add one.</div>';
  return rows.map(([n,v],ix)=>{const w=v/rows[0][1]*100,f=!anim&&lastW[n]!==undefined?lastW[n]:0;lastW[n]=w;return`<div class="cb"><div><b>${esc(n)}</b><em>${fmt(v)} · ${Math.round(v/tot*100)}%</em></div><span><i style="transform:scaleX(${f/100});opacity:${Math.max(.35,1-ix*.13)}" data-w="${w}"></i></span></div>`}).join('');
}
function dash(){
  const bal=sum('save')-sum('exp'),sv=todaySave(),ex=todayExp(),{target,limit}=S.set;
  const sp=target>0?sv/target*100:0,ep=limit>0?ex/limit*100:0,sk=streak();
  const month=t=>t.date.startsWith(T().slice(0,7));
  const mi=sum('save',month),me=sum('exp',month);
  const W={
   balance:`<div class="card glass"><div class="mu">Total stored balance</div><div class="big ${bal<0?'neg':''}">${fmt(bal)}</div><div class="mu">Saved ${fmt(sum('save'))} · Spent ${fmt(sum('exp'))}</div></div>`,
   rings:`<div class="row">
   <div class="card glass ct"><div class="mu">Today's savings</div>${ring('s',sp,saveColor(sp))}<b>${fmt(sv)}</b><span class="mu">of ${fmt(target)}${S.set.minEntry>0?`<br>min ${fmt(S.set.minEntry)}`:''}</span></div>
   <div class="card glass ct"><div class="mu">Today's expense</div>${ring('e',ep,expColor(ep))}<b>${fmt(ex)}</b><span class="mu">limit ${limit>0?fmt(limit):'off'}${limit>0&&ex>limit?`<br>over by ${fmt(ex-limit)}`:''}</span></div></div>`,
   streak:`<div class="card glass streak"><div class="fl" style="filter:${sk?'none':'grayscale(1) opacity(.5)'}">🔥</div><div><b>${sk} day${sk===1?'':'s'}</b><div class="mu">${sk?'Savings streak — keep it going':`Save ${fmt(target)} today to start a streak`}</div></div></div>`,
   month:`<div class="card glass"><div class="hd"><h2>This month</h2></div><div class="row ct"><div><div class="mu">Saved</div><b class="pos">${fmt(mi)}</b></div><div><div class="mu">Spent</div><b class="neg">${fmt(me)}</b></div><div><div class="mu">Net</div><b>${fmt(mi-me)}</b></div></div></div>`,
